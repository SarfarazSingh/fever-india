services:
- type: web
  name: federico-staging-api
  runtime: docker
  repo: https://github.com/SarfarazSingh/fever-india
  branch: release/federico-private-pilot
  rootDir: backend
  region: frankfurt
  plan: starter
  healthCheckPath: /health
  preDeployCommand: python scripts/initialize_release.py
  envVars:
  - fromGroup: federico-staging-secrets
  - key: ENVIRONMENT
    value: staging
  - key: DEMO_ENABLED
    value: 'false'
  - key: LIVE_CHECKOUT_ENABLED
    value: 'false'
  - key: DUFFEL_CARDS_APPROVED
    value: 'false'
  - key: LEGACY_API_ENABLED
    value: 'false'
  - key: AUTO_CHECKIN_ENABLED
    value: 'false'
  - key: AUTH_GOOGLE_ENABLED
    value: 'true'
  - key: AUTH_EMAIL_OTP_ENABLED
    value: 'false'
  - key: APP_URL
    value: https://federico-travel-staging.vercel.app
  - key: CORS_ORIGINS
    value: https://federico-travel-staging.vercel.app
  - key: DEFAULT_CURRENCY
    value: EUR
  - key: WORKER_CONCURRENCY
    value: '1'
- type: worker
  name: federico-staging-worker
  runtime: docker
  repo: https://github.com/SarfarazSingh/fever-india
  branch: release/federico-private-pilot
  rootDir: backend
  region: frankfurt
  plan: starter
  dockerCommand: python -m app.v1.jobs
  preDeployCommand: python scripts/initialize_release.py
  envVars:
  - fromGroup: federico-staging-secrets
  - key: ENVIRONMENT
    value: staging
  - key: DEMO_ENABLED
    value: 'false'
  - key: LIVE_CHECKOUT_ENABLED
    value: 'false'
  - key: DUFFEL_CARDS_APPROVED
    value: 'false'
  - key: LEGACY_API_ENABLED
    value: 'false'
  - key: AUTO_CHECKIN_ENABLED
    value: 'false'
  - key: AUTH_GOOGLE_ENABLED
    value: 'true'
  - key: AUTH_EMAIL_OTP_ENABLED
    value: 'false'
  - key: APP_URL
    value: https://federico-travel-staging.vercel.app
  - key: CORS_ORIGINS
    value: https://federico-travel-staging.vercel.app
  - key: DEFAULT_CURRENCY
    value: EUR
  - key: WORKER_CONCURRENCY
    value: '1'
