    value: staging
  - key: DEMO_ENABLED
    value: 'false'
  - key: LIVE_CHECKOUT_ENABLED
    value: 'false'
  - key: DUFFEL_CARDS_APPROVED
    value: 'false'
  - key: LEGACY_API_ENABLED
    value: 'false'
  - key: AUTO_CHECKIN_ENABLED
    value: 'false'
  - key: AUTH_GOOGLE_ENABLED
    value: 'true'
  - key: AUTH_EMAIL_OTP_ENABLED
    value: 'false'
  - key: APP_URL
    value: https://federico-travel-staging.vercel.app
  - key: CORS_ORIGINS
    value: https://federico-travel-staging.vercel.app
  - key: DEFAULT_CURRENCY
    value: EUR
  - key: DATABASE_URL
    sync: false
  - key: ALLOWED_EMAILS
    sync: false
  - key: SUPABASE_URL
    sync: false
  - key: SUPABASE_ANON_KEY
    sync: false
  - key: SUPABASE_SERVICE_ROLE_KEY
    sync: false
  - key: TOKEN_ENCRYPTION_KEY
    sync: false
  - key: DUFFEL_ACCESS_TOKEN
    sync: false
