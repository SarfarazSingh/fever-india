name: business_concierge
description: Business Class flight concierge with direct airline booking and automated 24-hour check-in.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # 6.1.x fails to build with Android Gradle Plugin 9 (deprecated ProGuard file).
  flutter_inappwebview: ^6.2.0-beta.3
  dio: ^5.7.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
